<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Paint - Tienda Oficial</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Navegación Común -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <span class="text-primary">Body</span> Paint
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Mis Pedidos</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="carrito.html" class="btn btn-outline-light position-relative">
                        Ver Carrito
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Banner Principal (Hero) -->
    <header class="hero-section text-white text-center py-5 mb-5 shadow-sm">
        <div class="container py-4">
            <h1 class="display-4 fw-bold">Catálogo de Productos</h1>
            <p class="lead">Explora nuestra gama de productos artísticos y maquillaje corporal profesional.</p>
        </div>
    </header>

    <!-- Sección Principal: Catálogo de Productos -->
    <main class="container my-5">
        <div class="row">
            <!-- Columna del Catálogo -->
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h3 fw-bold text-dark border-bottom border-primary border-3 pb-2">Nuestros Productos</h2>
                    <div class="text-end">
                        <div class="text-muted" id="total-productos-count">Cargando catálogo...</div>
                    </div>
                </div>

                <!-- Spinner de carga -->
                <div class="d-flex justify-content-center my-5" id="loader-productos">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>

                <!-- Grilla de Productos (Cards se inyectarán aquí) -->
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 d-none"
                    id="catalogo-productos">
                    <!-- Cards dinámicas -->
                </div>
            </div>
        </div>
    </main>

    <!-- Pie de Página Común -->
    <footer class="bg-dark text-white text-center py-4 mt-auto border-top border-secondary">
        <div class="container">
            <p class="mb-1">&copy; 2026 Body Paint. Trabajo Práctico Integrador - Grupo 6.</p>
            <small class="text-secondary">Metodología en Sistemas II</small>
        </div>
    </footer>

    <!-- (El modal de éxito ahora vive en carrito.html) -->

    <!-- Bootstrap 5 Bundle (JS + Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- Script principal de la página (Catálogo y Lógica) -->
    <script type="module" src="js/pages/catalogo.js"></script>
</body>

</html>
